<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Liberty Robotics — FIRST Team 1764</title>
    <meta
      name="description"
      content="Design preview for a rebuilt website for FIRST Robotics Competition Team 1764, Liberty Robotics, of Liberty, Missouri."
    />

    <style>
      :root {
        --brand-blue: #0a52b0;
        --brand-blue-deep: #06377a;
        --ink: #14202a;
        --paper: #ffffff;
        --rule: #d4dbe3;

        --measure: 34rem;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 3rem 1.5rem;
        background: var(--paper);
        color: var(--ink);
        font-family: system-ui, sans-serif;
        line-height: 1.6;
      }

      main {
        max-width: var(--measure);
        margin-inline: auto;
      }

      h1 {
        margin: 0 0 0.25rem;
        font-size: 2rem;
        line-height: 1.15;
      }

      .team-number {
        color: var(--brand-blue);
      }

      .status {
        margin: 0 0 2rem;
        padding-bottom: 2rem;
        border-bottom: 1px solid var(--rule);
        color: var(--brand-blue-deep);
      }

      a {
        color: var(--brand-blue);
      }

      a:focus-visible {
        outline: 3px solid var(--brand-blue);
        outline-offset: 2px;
      }
    </style>
  </head>

  <body>
    <main>
      <h1>Liberty Robotics <span class="team-number">1764</span></h1>
      <p class="status">Design preview. Not the team's live website.</p>

      <p>
        Three visual directions for a rebuilt Team 1764 site will appear here
        for review. Nothing on this page is final, including the colors.
      </p>

      <p>
        The team's current site is at
        <a href="http://www.first1764.com">first1764.com</a>.
      </p>
    </main>
  </body>
</html>
